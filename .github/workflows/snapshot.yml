name: 生成数据快照

# 云端常驻快照任务。
#
# GitHub 官方只保证 scheduled 事件「一小时内触发」，实测高频 cron（*/5）在高峰
# 会被大量丢弃：本仓库曾出现 12 小时只有 1 次定时运行，远端快照因此停在几小时前。
# 所以 5 分钟节奏不再交给平台调度，而是放进单个 job 内部，由脚本按 UTC 刻度循环
# 生成并发布；平台每 30 分钟的错峰定时只负责「续命」——新运行接管并重启循环，
# 既刷新 GITHUB_TOKEN，也避免单个 job 触到 6 小时硬上限。
#
# 即使某几次定时被丢弃，当前运行仍会持续发布最长 350 分钟，不会立刻停摆。
# 电脑关机不影响这条链路：它完全运行在 GitHub 的 runner 上。
on:
  schedule:
    # 两个低频、错开整点高峰的独立心跳，命中率显著高于 */5
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: '调试用：只跑指定轮数后退出，留空为常驻'
        required: false
        default: ''
      max_minutes:
        description: '调试用：最长运行分钟数，留空为 350'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/build-snapshot.mjs'
      - 'scripts/cloud-snapshot-loop.mjs'
      - 'server/**'
      - 'version.json'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: write
  # 循环接近 6 小时上限时，用 GITHUB_TOKEN 触发本工作流的下一棒
  actions: write

concurrency:
  group: kyiv-live-snapshot
  # 新心跳主动接管：取消旧循环并立即以新令牌重启第 1 轮，节奏不中断
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 常驻循环生成并发布快照
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERTS_UA_TOKEN: ${{ secrets.ALERTS_UA_TOKEN }}
          UPSTREAM_TIMEOUT: '12000'
          LOOP_MAX_MINUTES: ${{ inputs.max_minutes || '350' }}
          LOOP_ROUNDS: ${{ inputs.rounds }}
        run: node scripts/cloud-snapshot-loop.mjs
