name: 生成数据快照

# GitHub 不能运行长驻 Node 服务，因此用定时任务每 5 分钟调用同一套聚合逻辑，
# 把结果写成静态 JSON 推到独立的 snapshot 分支。客户端从 raw.githubusercontent.com
# 直读，手机不再依赖任何一台电脑在线。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-snapshot.mjs'
      - 'server/**'
      - 'version.json'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: write

concurrency:
  group: kyiv-live-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成聚合快照
        env:
          ALERTS_UA_TOKEN: ${{ secrets.ALERTS_UA_TOKEN }}
          UPSTREAM_TIMEOUT: '12000'
        run: node scripts/build-snapshot.mjs

      - name: 发布到 snapshot 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          work=$(mktemp -d)
          cp snapshot-out/status.json "$work/status.json"
          cd "$work"
          git init -q
          git checkout -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "数据快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git push -q --force origin snapshot
